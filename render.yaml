services:
  - type: web
    name: codenames
    runtime: node
    plan: free
    region: oregon
    buildCommand: bun install && bun run build
    startCommand: bun run start
    healthCheckPath: /health
    envVars:
      - key: BUN_VERSION
        value: 1.3.4
      - key: HOST
        value: 0.0.0.0
